# kube-state-metrics: turns Kubernetes object state into Prometheus metrics.
# Scoped to the n8n namespace with a namespaced Role (least privilege, no
# cluster-wide RBAC, no CRDs). This is the ONLY clean source for "how many
# worker pods / what does the HPA see", which n8n itself cannot know.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: n8n
  labels:
    app: kube-state-metrics
    app.kubernetes.io/part-of: n8n-selfhost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-state-metrics
  namespace: n8n
  labels:
    app: kube-state-metrics
    app.kubernetes.io/part-of: n8n-selfhost
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-metrics
  namespace: n8n
  labels:
    app: kube-state-metrics
    app.kubernetes.io/part-of: n8n-selfhost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: n8n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: n8n
  labels:
    app: kube-state-metrics
    app.kubernetes.io/part-of: n8n-selfhost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
        app.kubernetes.io/part-of: n8n-selfhost
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1
          args:
            - --namespaces=n8n
            - --resources=pods,deployments,replicasets,horizontalpodautoscalers
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: n8n
  labels:
    app: kube-state-metrics
    app.kubernetes.io/part-of: n8n-selfhost
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
