# Prometheus: scrapes two targets and nothing else.
#   1. n8n main + worker pods on :5678/metrics  -> queue depth + per-process CPU
#   2. kube-state-metrics on :8080              -> worker replicas + HPA state
# Plain Deployment, namespaced pod discovery (least privilege), emptyDir storage
# with 1h retention (this is a demo, not long-term storage). No operator, no CRDs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: n8n
  labels:
    app: prometheus
    app.kubernetes.io/part-of: n8n-selfhost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: n8n
  labels:
    app: prometheus
    app.kubernetes.io/part-of: n8n-selfhost
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: n8n
  labels:
    app: prometheus
    app.kubernetes.io/part-of: n8n-selfhost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: n8n
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: n8n
  labels:
    app: prometheus
    app.kubernetes.io/part-of: n8n-selfhost
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: n8n
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [n8n]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: "n8n-(main|worker)"
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: "(.+)"
            replacement: "${1}:5678"
            target_label: __address__
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: n8n
  labels:
    app: prometheus
    app.kubernetes.io/part-of: n8n-selfhost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/part-of: n8n-selfhost
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 20
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: n8n
  labels:
    app: prometheus
    app.kubernetes.io/part-of: n8n-selfhost
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
